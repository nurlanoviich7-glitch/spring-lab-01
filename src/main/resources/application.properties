spring.application.name=spring-lab-01
server.address=127.0.0.1
server.port=${PORT:8088}
app.owner=Akhmet Didar and Magazhan Nurdaulet, IS-2405
logging.level.web=INFO
app.date-pattern=2007-09-03 HH:mm:ss
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.thymeleaf.encoding=UTF-8
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
springdoc.paths-to-match=/api/books/**,/api/lab8/**,/api/lab8/**
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

spring.profiles.default=dev
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5438/springlab}
spring.datasource.username=${DB_USER:springlab}
spring.datasource.password=${DB_PASSWORD:springlab}
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.properties.hibernate.session_factory.statement_inspector=kz.iitu.springlab.catalog.SqlRecorder
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true
spring.jpa.properties.hibernate.default_batch_fetch_size=0
spring.data.web.pageable.max-page-size=100
logging.level.org.hibernate.stat=ERROR
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=ERROR
