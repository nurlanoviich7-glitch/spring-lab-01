spring.application.name=spring-lab-01
server.address=127.0.0.1
server.port=8080
app.owner=Akhmet Didar and Magazhan Nurdaulet, IS-2405
logging.level.web=INFO
app.date-pattern=2007-09-03 HH:mm:ss
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.thymeleaf.encoding=UTF-8
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
springdoc.paths-to-match=/api/books/**
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
