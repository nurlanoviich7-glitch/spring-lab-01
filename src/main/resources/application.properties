spring.application.name=tx-lab09
server.address=127.0.0.1
server.port=${PORT:8089}
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5438/txlab9}
spring.datasource.username=${DB_USER:springlab}
spring.datasource.password=${DB_PASSWORD:springlab}
spring.datasource.hikari.maximum-pool-size=8
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
server.error.include-stacktrace=never
server.error.include-exception=false
