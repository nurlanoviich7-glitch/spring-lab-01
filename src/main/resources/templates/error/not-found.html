<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{book.notFound.title}">Book not found</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
</head>
<body>
<header class="topbar">
    <a class="brand" th:href="@{/}" th:text="#{app.brand}">Open Shelf</a>
    <nav th:attr="aria-label=#{nav.main}"><a th:href="@{/books}" th:text="#{nav.catalogue}">Catalogue</a><a th:href="@{/books/new}" th:text="#{nav.new}">Add a book</a><a th:href="@{/api/books}" th:text="#{nav.api}">JSON API</a></nav>
    <div class="languages" th:attr="aria-label=#{language.choose}"><a th:href="@{/books/{id}(id=${bookId},lang='en')}" lang="en" th:text="#{language.en}">English</a><a th:href="@{/books/{id}(id=${bookId},lang='ru')}" lang="ru" th:text="#{language.ru}">Русский</a></div>
</header>
<main class="container form-container">
    <section class="panel not-found-panel">
        <p class="status-code" th:text="#{error.code}">404</p>
        <h1 th:text="${title}">Book not found</h1>
        <p class="intro" th:text="${message}">The requested book could not be found.</p>
        <a class="button-link" th:href="@{/books}" th:text="#{book.back}">Back to catalogue</a>
    </section>
    <footer><span th:text="#{lab.name}">Laboratory Work 6</span><span th:text="${owner}">Akhmet Didar and Magazhan Nurdaulet, IS-2405</span></footer>
</main>
</body>
</html>
