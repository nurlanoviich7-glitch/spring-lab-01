<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{catalogue.title}">Catalogue</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
</head>
<body>
<header class="topbar">
    <a class="brand" th:href="@{/}" th:text="#{app.brand}">Open Shelf</a>
    <nav th:attr="aria-label=#{nav.main}"><a class="active" th:href="@{/books}" th:text="#{nav.catalogue}">Catalogue</a><a th:href="@{/books/new}" th:text="#{nav.new}">Add a book</a><a th:href="@{/api/books}" th:text="#{nav.api}">JSON API</a></nav>
    <div class="languages" th:attr="aria-label=#{language.choose}">
        <a th:href="@{/books(lang='en',author=${author})}" lang="en" th:text="#{language.en}" th:classappend="${#locale.language == 'en'} ? 'selected' : ''">English</a>
        <a th:href="@{/books(lang='ru',author=${author})}" lang="ru" th:text="#{language.ru}" th:classappend="${#locale.language == 'ru'} ? 'selected' : ''">Русский</a>
    </div>
</header>
<main class="container">
    <div class="page-heading"><div><p class="eyebrow" th:text="#{catalogue.eyebrow}">YOUR READING COLLECTION</p><h1 th:text="#{catalogue.title}">Catalogue</h1><p class="intro" th:text="#{catalogue.intro}">Find your next read.</p></div><a class="button-link" th:href="@{/books/new}" th:text="#{nav.new}">Add a book</a></div>
    <p class="flash" role="status" th:if="${message}" th:text="${message}"></p>
    <section class="panel catalogue-panel" th:attr="aria-label=#{catalogue.collection}">
        <div class="panel-heading"><h2 th:text="#{catalogue.collection}">The collection</h2><span class="count" th:text="${books.size() == 1} ? #{catalogue.count.one} : #{catalogue.count.many(${books.size()})}">3 books</span></div>
        <form th:action="@{/books}" method="get" class="filter">
            <div class="field"><label for="author-filter" th:text="#{catalogue.filter}">Filter by author</label><input id="author-filter" name="author" type="search" th:placeholder="#{catalogue.filter.placeholder}" th:value="${author}"></div>
            <button type="submit" th:text="#{catalogue.filter.apply}">Apply filter</button><a class="text-link" th:href="@{/books}" th:text="#{catalogue.filter.clear}">Clear</a>
        </form>
        <div class="table-scroll"><table>
            <thead><tr><th scope="col" th:text="#{book.number}">No.</th><th scope="col" th:text="#{book.title}">Title</th><th scope="col" th:text="#{book.author}">Author</th><th scope="col" th:text="#{book.year}">Year</th></tr></thead>
            <tbody>
            <tr th:each="book : ${books}"><td class="book-id" th:text="${book.id}">1</td><td class="book-title"><a th:href="@{/books/{id}(id=${book.id})}" th:text="${book.title}">Effective Java</a></td><td th:text="${book.author}">Joshua Bloch</td><td class="year" th:text="${book.year}">2018</td></tr>
            <tr th:if="${books.isEmpty()}"><td colspan="4" class="empty" th:text="#{catalogue.empty}">No matching books.</td></tr>
            </tbody>
        </table></div>
    </section>
    <footer><span th:text="#{lab.name}">Laboratory Work 6</span><span th:text="${owner}">Akhmet Didar and Magazhan Nurdaulet, IS-2405</span></footer>
</main>
</body>
</html>
