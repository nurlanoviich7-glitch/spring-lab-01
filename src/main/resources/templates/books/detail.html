<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{book.details}">Book details</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
</head>
<body>
<header class="topbar">
    <a class="brand" th:href="@{/}" th:text="#{app.brand}">Open Shelf</a>
    <nav th:attr="aria-label=#{nav.main}"><a th:href="@{/books}" th:text="#{nav.catalogue}">Catalogue</a><a th:href="@{/books/new}" th:text="#{nav.new}">Add a book</a><a th:href="@{/api/books}" th:text="#{nav.api}">JSON API</a></nav>
    <div class="languages" th:attr="aria-label=#{language.choose}"><a th:href="@{/books/{id}(id=${book.id},lang='en')}" lang="en" th:text="#{language.en}">English</a><a th:href="@{/books/{id}(id=${book.id},lang='ru')}" lang="ru" th:text="#{language.ru}">Русский</a></div>
</header>
<main class="container form-container">
    <a class="back-link" th:href="@{/books}" th:text="#{book.back}">Back to catalogue</a>
    <div class="page-heading"><div><p class="eyebrow" th:text="#{book.details}">Book details</p><h1 th:text="${book.title}">Book title</h1><p class="intro" th:text="${book.author}">Author</p></div></div>
    <section class="panel detail-panel" th:attr="aria-label=#{book.details}">
        <dl class="book-details"><dt th:text="#{book.number}">No.</dt><dd th:text="${book.id}">1</dd><dt th:text="#{book.title}">Title</dt><dd th:text="${book.title}">Effective Java</dd><dt th:text="#{book.author}">Author</dt><dd th:text="${book.author}">Joshua Bloch</dd><dt th:text="#{book.year}">Year</dt><dd th:text="${book.year}">2018</dd></dl>
    </section>
    <footer><span th:text="#{lab.name}">Laboratory Work 6</span><span th:text="${owner}">Akhmet Didar and Magazhan Nurdaulet, IS-2405</span></footer>
</main>
</body>
</html>
