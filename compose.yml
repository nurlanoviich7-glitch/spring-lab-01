services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: txlab9
      POSTGRES_USER: springlab
      POSTGRES_PASSWORD: springlab
    ports: ["127.0.0.1:5439:5432"]
    volumes:
      - txlab9-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
volumes:
  txlab9-data:
