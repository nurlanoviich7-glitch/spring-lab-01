services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: springlab
      POSTGRES_PASSWORD: springlab
      POSTGRES_DB: springlab
    ports:
      - "127.0.0.1:5438:5432"
    volumes:
      - lab08_postgres:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-lab8.sql:ro
volumes:
  lab08_postgres:
